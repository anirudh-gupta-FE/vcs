<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="output.css" />
  </head>
  <body class="bg-[#0f0c29]">
    <div
      class="bg-[#302b63] mt-20 px-4 py-2 mx-auto rounded-lg border-neutral-200 border-4 w-96 h-3/4 focus-within:border-emerald-600 focus-within:shadow-emerald-600/10 focus-within:shadow-xl"
    >
      <h1 class="text-center text-white text-xl">Calculate Your BMI</h1>
      <p class="mt-3 text-sm text-white">Height in m</p>
      <input
        id="Height"
        class="border-neutral-500 border-[0.5px] px-1 py-1 outline-none focus:ring-2 focus:ring-blue-300 focus:border-blue-700 focus:border-[0.5px] mt-1 w-[100%] rounded-sm bg-neutral-50"
        type="text"
      />
      <p class="mt-3 text-sm text-white">Weight</p>
      <input
        id="Weight"
        class="border-neutral-500 border-[0.5px] px-1 py-1 outline-none focus:ring-2 focus:ring-blue-300 focus:border-blue-700 focus:border-[0.5px] mt-1 w-[100%] rounded-sm bg-neutral-50"
        type="text"
      />
      <p class="mt-3 text-sm text-white">BMI</p>
      <input
        id="BMI"
        class="border-neutral-500 border-[0.5px] px-1 py-1 outline-none focus:ring-2 focus:ring-blue-300 focus:border-blue-700 focus:border-[0.5px] mt-1 w-[100%] rounded-sm bg-neutral-50"
        type="text"
      />
      <p class="mt-3 text-sm text-white">BMI Prime</p>
      <input
        id="Prime"
        class="border-neutral-500 border-[0.5px] px-1 py-1 outline-none focus:ring-2 focus:ring-blue-300 focus:border-blue-700 focus:border-[0.5px] mt-1 w-[100%] rounded-sm bg-neutral-50"
        type="text"
      />
      <button
        onclick="bmi()"
        class="p-2 my-5 bg-white text-[#0f0c29] rounded-lg hover:cursor-pointer"
      >
        Check Now
      </button>
      <p class="mt-3 text-sm text-white" id="BMI_Details"></p>
    </div>
    <script src="app.js"></script>
  </body>
</html>
