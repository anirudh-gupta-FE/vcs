<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Check Email</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="card">
      <img src="mail_light.png" alt="" class="card-img" />
      <h2>Check Your email</h2>
      <p>
        Enter the 6-digit that we just sent to
        <b>amy.smith@zest.com</b> to continue.
      </p>
      <input
        type="text"
        maxlength="6"
        minlength="0"
        class="input"
        placeholder="Enter the OTP"
      />
      <br />
      <button class="btn-1">Continue</button>
    </div>
  </body>
</html>
