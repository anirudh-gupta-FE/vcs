<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <title>Company Details</title>
  </head>
  <body>
    <div class="card">
      <p class="emoji">🏢</p>
      <h2>Your Company</h2>
      <p>
        Tell us about your company. You will be able to invite your teammates in
        the next step.
      </p>
      <p class="company-label">Company Name</p>
      <input
        type="text"
        maxlength="6"
        minlength="0"
        class="input-company"
        placeholder="Enter the Company Name"
      />
      <p class="company-label">Industry (optional)</p>
      <select>
        <option value="Creative Agency">🎨 Creative Agency</option>
      </select>
      <p class="company-label">Your role (optional)</p>
      <select>
        <option value="Owner">🎯 Owner / Founder / CEO</option>
      </select>
      <p class="company-label">Company size (optional)</p>
      <select>
        <option value="2-10">2-10</option>
      </select>
    </div>
  </body>
</html>
