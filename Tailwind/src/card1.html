<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="output.css" />
  </head>
  <body class="bg-gray-100">
    <div class="bg-white rounded-2xl m-auto mt-44 w-[500px] p-5 text-center">
      <img
        class="mx-auto"
        src="mail_light.png"
        alt=""
        class="h-[100%] rounded-xl"
      />
      <h1 class="text-4xl my-5 font-bold">Check Your email</h1>
      <h4 class="text-xl text-gray-500 mb-4">
        Enter the 6-digit that we just sent to
        <span class="text-black font-bold">amy.smith@zest.com</span>
        to continue.
      </h4>
      <input
        type="text"
        placeholder="Enter the OTP"
        class="py-2.5 border-2 border-[#a28eca] rounded-xl text-center w-[100%] outline-none focus:ring-violet-300 focus:ring-2"
      />
      <button
        class="mt-3.5 bg-[#6a2eff] rounded-xl w-[100%] text-white py-2.5 cursor-pointer"
      >
        Continue
      </button>
    </div>
  </body>
</html>
