<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="output.css" />
  </head>
  <body class="bg-gray-100">
    <div
      class="bg-white rounded-2xl m-auto mt-12 w-[400px] p-7 text-center box-sizing:border-box"
    >
      <p class="text-5xl my-12">🏢</p>
      <h2 class="text-2xl my-3 font-bold">Your Company</h2>
      <p class="text-gray-600">
        Tell us about your company. You will be able to invite your teammates in
        the next step.
      </p>
      <p class="text-xs text-start text-gray-500 mt-5 mb-2">Company Name</p>
      <input
        type="text"
        maxlength="6"
        minlength="0"
        class="w-[100%] border-1 border-gray-600 rounded-lg pl-2 py-1.5"
        placeholder="Enter the Company Name"
      />
      <p class="text-xs text-start text-gray-500 mt-5 mb-2">Industry (optional)</p>
      <select
        class="w-[100%] border-1 text-gray-600 text-sm border-gray-600 rounded-lg pl-1 py-1.5 outline-none"
      >
        <option value="Creative Agency">🎨 Creative Agency</option>
      </select>
      <p class="text-xs text-start text-gray-500 mt-5 mb-2">
        Your role (optional)
      </p>
      <select class="w-[100%] border-1 text-gray-600 text-sm border-gray-600 rounded-lg pl-1 py-1.5 outline-none">
        <option value="Owner">🎯 Owner / Founder / CEO</option>
      </select class="w-[100%] border-1 text-gray-600 text-sm border-gray-600 rounded-lg pl-1 py-1.5 outline-none">
      <p class="text-xs text-start text-gray-500 mt-5 mb-2">
        Company size (optional)
      </p>
      <select class="w-[100%] border-1 text-gray-600 text-sm border-gray-600 rounded-lg pl-2 py-1.5 outline-none">
        <option  value="2-10">2-10</option>
      </select>
    </div>
  </body>
</html>
